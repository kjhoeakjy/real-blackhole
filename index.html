<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우주 여행</title>
<meta name="description" content="지금 이 순간의 실제 우주 어딘가에서 눈을 뜨고, 시간이 흐르는 우주선 안에서 사건마다 선택하며 지구로 돌아오는 1인칭 게임. 거리·속도·위험은 전부 실제 측정값이에요.">
<meta property="og:title" content="우주 여행">
<meta property="og:description" content="실제 우주 어딘가에서 눈을 떠 지구로 돌아오는 1인칭 인생 게임">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/ui/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e9a65b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23000'/%3E%3C/svg%3E">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="map-canvas"></canvas>
  <canvas id="bh-canvas" class="hidden"></canvas>
  <div id="labels"></div>
  <div id="vignette"></div>
</div>
<div id="flash"></div>

<header id="top">
  <div id="brand"><span class="mark">우주 여행</span><span class="sub">Real space travel</span></div>
  <div class="spacer"></div>
  <div id="clock"><span class="dot"></span><span class="num" id="clock-text">—</span></div>
</header>

<aside id="panel"><div id="panel-body"></div></aside>
<button id="panel-toggle" title="패널 열기">☰</button>

<div id="scale"></div>
<div id="hint"></div>
<div id="voy-top" class="hidden"><div class="row"><span class="age num">—</span><span class="day num">—</span></div><div class="bar"><i></i></div><div class="sub"><span><em>지구까지</em><b class="num" id="c-dist">—</b></span><span><em>속도</em><b class="num" id="c-speed">—</b></span><span><em>지구 날짜</em><b class="num" id="c-earth">—</b></span><span><em>동료</em><b class="num" id="c-crew">—</b></span></div></div>
<div id="cockpit" class="hidden"><div class="frame"></div>
  <div class="hud">
    <div class="g" id="g-food"><span class="l">식량</span><span class="v num">—</span><div class="bar"><i></i></div></div>
    <div class="g" id="g-water"><span class="l">물</span><span class="v num">—</span><div class="bar"><i></i></div></div>
    <div class="g" id="g-o2"><span class="l">산소</span><span class="v num">—</span><div class="bar"><i></i></div></div>
    <div class="g" id="g-power"><span class="l">전력</span><span class="v num">—</span><div class="bar"><i></i></div></div>
    <div class="g" id="g-hull"><span class="l">선체</span><span class="v num">—</span><div class="bar"><i></i></div></div>
    <div class="g" id="g-health"><span class="l">몸</span><span class="v num">—</span><div class="bar"><i></i></div></div>
    <div class="g" id="g-morale"><span class="l">마음</span><span class="v num">—</span><div class="bar"><i></i></div></div>
    <div class="g" id="g-dose"><span class="l">피폭</span><span class="v num">—</span><div class="bar"><i></i></div></div>
  </div>
</div>
<div id="voy-ctl" class="hidden"></div>
<div id="toast"></div>
<div id="landing" class="hidden"><div class="sky"></div><div class="sun"></div><div class="ground"></div></div>
<div id="card" class="hidden"></div>

<div id="loading"><div class="ring"></div><div class="msg" id="loading-msg">자료를 불러오는 중</div></div>
<div id="error"><div class="box"><h2>실행할 수 없어요</h2><p class="note" id="error-msg"></p></div></div>

<script src="vendor/astronomy.browser.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
