<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우주 여행</title>
<meta name="description" content="지금 이 순간의 실제 우주에서 출발지와 목적지를 고르면, 실제 탈것의 속도로 얼마나 걸리는지와 살아서 돌아올 확률을 계산해요. 블랙홀은 일반상대론 광선추적으로 봐요.">
<meta property="og:title" content="우주 여행">
<meta property="og:description" content="실제 측정값으로 계산한 우주 여행 시간과 생존 확률">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/ui/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e9a65b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23000'/%3E%3C/svg%3E">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="map-canvas"></canvas>
  <canvas id="bh-canvas" class="hidden"></canvas>
  <div id="labels"></div>
  <div id="vignette"></div>
</div>
<div id="flash"></div>

<header id="top">
  <div id="brand"><span class="mark">우주 여행</span><span class="sub">Real space travel</span></div>
  <div class="spacer"></div>
  <div id="clock"><span class="dot"></span><span class="num" id="clock-text">—</span></div>
</header>

<aside id="panel"><div id="panel-body"></div></aside>
<button id="panel-toggle" title="패널 열기">☰</button>

<div id="scale"></div>
<div id="hint"></div>

<div id="loading"><div class="ring"></div><div class="msg" id="loading-msg">자료를 불러오는 중</div></div>
<div id="error"><div class="box"><h2>실행할 수 없어요</h2><p class="note" id="error-msg"></p></div></div>

<script src="vendor/astronomy.browser.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
